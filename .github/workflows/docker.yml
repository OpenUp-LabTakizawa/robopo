name: 🐳 Docker CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Build docker images with no cache"
        default: false
        required: false
        type: boolean
      push:
        description: 'Push docker image to registry'
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1.17.0
    if: github.repository_owner == 'openup-labtakizawa'
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.event_name == 'push' || inputs.push == true }}
      platforms: linux/amd64,linux/arm64
      cache: ${{ inputs.no-cache != true }}
      cache-mode: max
      sbom: ${{ github.event_name == 'push' || inputs.push == true }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: |
        marukome0743/robopo
        ghcr.io/openup-labtakizawa/robopo
      meta-labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
        type=ref,event=pr,prefix=pr-
        type=raw,value=canary,enable=${{ github.event_name != 'pull_request' }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: marukome0743
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || inputs.push == true
    permissions:
      attestations: write
      id-token: write

    steps:
      - name: 🪪 Attest
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/openup-labtakizawa/robopo
          subject-digest: ${{ needs.build.outputs.digest }}
