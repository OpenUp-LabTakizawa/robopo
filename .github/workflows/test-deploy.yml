name: 🌐 Test deployment

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: main
    paths:
      - "@robopo/docs/**"

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐣 Setup mise
        uses: jdx/mise-action@v4.3.0
        with:
          install_args: bun

      - name: 📦 Install dependencies
        run: bun i --frozen-lockfile
      - name: 🌐 Test build website
        run: bun docs-build
