[tools]
bun = "latest"
ffmpeg = "latest"
rumdl = "latest"
pitchfork = "latest"

[tasks.fix]
description = "Auto-fix with Biome, then rumdl on the markdown files"
run = ["bun fix --unsafe", "mise fix:md"]

[tasks."fix:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update --recursive", "mise deps"]

[daemons.web]
run = "bun dev"
port = 3000
ready_port = 3000

[deps.bun]
auto = true

[hooks]
enter = ["mise deps -q"]

[settings]
experimental = true
