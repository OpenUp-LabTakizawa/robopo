[tools]
bun = "latest"
ffmpeg = "latest"
rumdl = "latest"
pitchfork = "latest"

[tasks.fix]
run = ["bun fix --unsafe", "mise fix:md"]

[tasks."fix:md"]
description = "Check markdown files for linting issues"
run = "rumdl check --fix ."

[tasks.setup-env]
description = "Setup environment variables for @robopo/web"
run = "bun run setup-env"

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

# Replaces the former `pitchfork.toml`. mise writes the pitchfork config under
# $MISE_STATE_DIR and registers it, so the daemon runs with the mise
# environment. `mise daemons` drives pitchfork rather than replacing it, which
# is why it stays in [tools].
[daemons.web]
run = "bun dev"
ready_port = 3000

[deps.bun]
auto = true

[hooks]
enter = ["mise upgrade -q", "mise deps -q"]

[settings]
experimental = true
